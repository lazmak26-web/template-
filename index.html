<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1uci17er</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    cursor: none;
  }

  html, body {
    min-height: 100vh;
    overflow-x: hidden;
    background: #05050a;
    color: #fff;
  }

  /* ====== الفيديو فالخلفية ====== */
  .video-bg {
    position: fixed;
    inset: 0;
    z-index: -3;
    overflow: hidden;
  }

  .video-bg video {
    position: absolute;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    object-fit: cover;
    pointer-events: none;
  }

  .video-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.25), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.2), transparent 50%),
      linear-gradient(rgba(5, 5, 10, 0.55), rgba(5, 5, 10, 0.75));
    z-index: 1;
  }

  .video-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    z-index: 2;
    mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
  }

  /* ====== Cursor مخصص ====== */
  .cursor-dot, .cursor-ring {
    position: fixed;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 9999;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .cursor-dot {
    width: 6px; height: 6px;
    background: #fff;
    box-shadow: 0 0 10px #fff, 0 0 20px #a855f7;
  }
  .cursor-ring {
    width: 34px; height: 34px;
    border: 1.5px solid rgba(168, 85, 247, 0.8);
    transition: width 0.2s, height 0.2s, border-color 0.2s;
  }
  .cursor-ring.hover {
    width: 60px; height: 60px;
    border-color: #22d3ee;
  }

  @media (max-width: 900px) {
    * { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
  }

  /* ====== Loader ====== */
  .loader {
    position: fixed;
    inset: 0;
    background: #05050a;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 30px;
    z-index: 10000;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  .loader.hide {
    opacity: 0;
    visibility: hidden;
  }

  .loader-ring {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: #a855f7;
    border-right-color: #22d3ee;
    animation: spin 1s linear infinite;
    position: relative;
    box-shadow: 0 0 30px rgba(168,85,247,0.5), inset 0 0 30px rgba(34,211,238,0.3);
  }
  .loader-ring::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-bottom-color: #f472b6;
    animation: spin 0.7s linear infinite reverse;
  }
  .loader-text {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 8px;
    font-size: 14px;
    color: #a855f7;
    animation: pulseText 1.5s ease-in-out infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseText {
    0%, 100% { opacity: 0.4; text-shadow: 0 0 5px #a855f7; }
    50% { opacity: 1; text-shadow: 0 0 20px #a855f7, 0 0 40px #22d3ee; }
  }

  /* ====== Container ====== */
  .container {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px 20px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1s ease, transform 1s ease;
  }
  .container.show {
    opacity: 1;
    transform: translateY(0);
  }

  /* ====== Card ====== */
  .card {
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 40px 30px;
    border-radius: 24px;
    background: rgba(10, 10, 20, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.02),
      0 30px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    text-align: center;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 26px;
    padding: 1px;
    background: conic-gradient(from 0deg,
      transparent 0%,
      #a855f7 15%,
      #22d3ee 25%,
      transparent 40%,
      transparent 60%,
      #f472b6 75%,
      #a855f7 85%,
      transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: rotateBorder 6s linear infinite;
    pointer-events: none;
  }
  @keyframes rotateBorder {
    to { transform: rotate(360deg); }
  }

  /* ====== Avatar ====== */
  .avatar-wrap {
    position: relative;
    width: 120px;
    height: 120px;
    margin: 0 auto 20px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(#a855f7, #22d3ee, #f472b6, #a855f7);
    animation: rotateBorder 4s linear infinite;
    filter: blur(2px);
  }
  .avatar {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    border: 3px solid #05050a;
    text-shadow: 0 0 20px #a855f7;
    overflow: hidden;
    object-fit: cover;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    animation: shine 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
  }

  /* ====== Status badge ====== */
  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 50px;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.3);
    font-size: 12px;
    color: #22d3ee;
    margin-bottom: 18px;
    font-weight: 500;
    backdrop-filter: blur(10px);
  }
  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 10px #22d3ee;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ====== العنوان ====== */
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #a855f7, #22d3ee, #f472b6);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: gradientText 3s linear infinite;
  }
  @keyframes gradientText {
    to { background-position: 200% center; }
  }

  .typing {
    font-size: 14px;
    color: #d0d0e0;
    min-height: 22px;
    margin-bottom: 30px;
    letter-spacing: 1px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .typing .caret {
    display: inline-block;
    width: 2px;
    height: 14px;
    background: #a855f7;
    margin-right: 2px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
  }

  /* ====== الأيقونات ====== */
  .social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 25px;
  }

  .social-links a {
    position: relative;
    width: 68px;
    height: 68px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 18px;
    color: #fff;
    font-size: 28px;
    text-decoration: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s, border-color 0.35s;
    overflow: hidden;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  .social-links a::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s;
    z-index: -1;
  }

  .social-links a i {
    transition: transform 0.35s;
    z-index: 1;
  }

  .social-links a:hover {
    transform: translateY(-8px) scale(1.08);
    border-color: rgba(255,255,255,0.3);
  }

  .social-links a:hover i {
    transform: scale(1.15) rotate(-5deg);
  }

  .tiktok::before {
    background: linear-gradient(135deg, #25F4EE, #FE2C55, #000);
  }
  .tiktok:hover {
    box-shadow: 0 0 25px rgba(254, 44, 85, 0.7), 0 0 50px rgba(37, 244, 238, 0.4);
  }
  .tiktok:hover::before { opacity: 1; }

  .instagram::before {
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
  }
  .instagram:hover {
    box-shadow: 0 0 25px rgba(220, 39, 67, 0.7), 0 0 50px rgba(188, 24, 136, 0.4);
  }
  .instagram:hover::before { opacity: 1; }

  .telegram::before {
    background: linear-gradient(135deg, #0088cc, #00c6ff);
  }
  .telegram:hover {
    box-shadow: 0 0 25px rgba(0, 136, 204, 0.7), 0 0 50px rgba(0, 198, 255, 0.4);
  }
  .telegram:hover::before { opacity: 1; }

  /* ====== Footer ====== */
  .footer {
    font-size: 11px;
    color: #8a8a9e;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .footer span {
    color: #a855f7;
    font-weight: 600;
  }

  /* ====== Responsive ====== */
  @media (max-width: 500px) {
    .card { padding: 32px 22px; border-radius: 20px; }
    h1 { font-size: 22px; }
    .avatar-wrap { width: 100px; height: 100px; }
    .avatar { font-size: 34px; }
    .social-links { gap: 14px; }
    .social-links a { width: 60px; height: 60px; font-size: 24px; border-radius: 16px; }
    .container { padding: 20px 15px; }
  }

  @media (max-width: 360px) {
    .social-links a { width: 54px; height: 54px; font-size: 22px; }
  }

  @media (orientation: portrait) and (max-width: 600px) {
    .video-bg video {
      min-width: 100%;
      min-height: 100%;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  }
</style>
</head>
<body>

  <!-- ===== الفيديو فالخلفية (Cloudinary) ===== -->
  <div class="video-bg">
    <video
      autoplay
      muted
      loop
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="https://res.cloudinary.com/t6zzg4qd/video/upload/v1791989666/bg.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Cursor -->
  <div class="cursor-dot"></div>
  <div class="cursor-ring"></div>

  <!-- اللودر -->
  <div class="loader" id="loader">
    <div class="loader-ring"></div>
    <div class="loader-text">LOADING</div>
  </div>

  <!-- المحتوى -->
  <div class="container" id="main">
    <div class="card">

      <div class="avatar-wrap">
        <div class="avatar">L</div>
      </div>

      <div class="status">
        <span class="dot"></span>
        Online Now
      </div>

      <h1>1UCI17ER</h1>

      <div class="typing" id="typing">
        <span class="caret"></span>
      </div>

      <div class="social-links">
        <a href="https://www.tiktok.com/@1uci17er?_r=1&_t=ZS-9AY8bb5iTjg" target="_blank" class="tiktok" aria-label="TikTok">
          <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://instagram.com/1uci17er?xtok=MTdxYzlxdjljcHN0dA%3D%3D" target="_blank" class="instagram" aria-label="Instagram">
          <i class="fab fa-instagram"></i>
        </a>
        <a href="https://t.me/l1uci7er" target="_blank" class="telegram" aria-label="Telegram">
          <i class="fab fa-telegram"></i>
        </a>
      </div>

      <div class="footer">© 2025 — Made by <span>1uci17er</span></div>

    </div>
  </div>

<script>
  /* ===== تشغيل الفيديو بالقوة ===== */
  const video = document.querySelector('.video-bg video');
  if (video) {
    video.play().catch(() => {
      const playOnTouch = () => {
        video.play();
        document.removeEventListener('touchstart', playOnTouch);
        document.removeEventListener('click', playOnTouch);
      };
      document.addEventListener('touchstart', playOnTouch, { once: true });
      document.addEventListener('click', playOnTouch, { once: true });
    });
  }

  /* ===== Cursor ===== */
  const dot = document.querySelector('.cursor-dot');
  const ring = document.querySelector('.cursor-ring');
  let mx = 0, my = 0, rx = 0, ry = 0;

  window.addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.left = mx + 'px';
    dot.style.top = my + 'px';
  });

  function animateRing() {
    rx += (mx - rx) * 0.15;
    ry += (my - ry) * 0.15;
    ring.style.left = rx + 'px';
    ring.style.top = ry + 'px';
    requestAnimationFrame(animateRing);
  }
  animateRing();

  document.querySelectorAll('a, .social-links a').forEach(el => {
    el.addEventListener('mouseenter', () => ring.classList.add('hover'));
    el.addEventListener('mouseleave', () => ring.classList.remove('hover'));
  });

  /* ===== Loader ===== */
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loader').classList.add('hide');
      document.getElementById('main').classList.add('show');
      startTyping();
    }, 1400);
  });

  /* ===== Typing effect ===== */
  const typingEl = document.getElementById('typing');
  const texts = [
    'تابعني على مواقع التواصل 👇',
    'اشترك في القناة و لا تنسى الإشعارات 🔔',
    'شكراً على الزيارة ❤️'
  ];
  let textIndex = 0, charIndex = 0, deleting = false;

  function startTyping() {
    const current = texts[textIndex];
    if (!deleting) {
      typingEl.innerHTML = current.substring(0, charIndex + 1) + '<span class="caret"></span>';
      charIndex++;
      if (charIndex === current.length) {
        deleting = true;
        setTimeout(startTyping, 1800);
        return;
      }
    } else {
      typingEl.innerHTML = current.substring(0, charIndex - 1) + '<span class="caret"></span>';
      charIndex--;
      if (charIndex === 0) {
        deleting = false;
        textIndex = (textIndex + 1) % texts.length;
      }
    }
    setTimeout(startTyping, deleting ? 35 : 70);
  }
</script>

</body>
</html>
