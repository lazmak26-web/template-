<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05050a">
<meta name="color-scheme" content="dark">
<title>1uci17er</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Orbitron:wght@700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

<style>
  @property --angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }

  :root {
    --purple: #a855f7;
    --cyan: #22d3ee;
    --pink: #f472b6;
    --bg: #05050a;
    --text: #fff;
    --muted: #b8b8cc;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    min-height: 100%;
    background: var(--bg);
  }
  body {
    min-height: 100%;
    background: transparent;
    color: var(--text);
    font-family: 'Poppins', 'Tajawal', system-ui, sans-serif;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  .video-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, #2a0a4a, transparent 60%),
      radial-gradient(circle at 70% 80%, #062a3a, transparent 60%),
      var(--bg);
  }
  .video-bg video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    transition: opacity 1.2s ease;
  }
  .video-bg video.ready { opacity: 1; }

  .video-bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(120, 0, 255, 0.25), transparent 50%),
      radial-gradient(circle at 80% 70%, rgba(0, 200, 255, 0.2), transparent 50%),
      linear-gradient(rgba(5, 5, 10, 0.25), rgba(5, 5, 10, 0.5));
    pointer-events: none;
  }
  .video-bg::before {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
    -webkit-mask-image: radial-gradient(circle at center, #000 30%, transparent 80%);
    pointer-events: none;
  }

  #particles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
  }

  .cursor-dot, .cursor-ring { display: none; }

  @media (hover: hover) and (pointer: fine) {
    body.custom-cursor, body.custom-cursor * { cursor: none; }
    .cursor-dot, .cursor-ring {
      display: block;
      position: fixed;
      top: 0; left: 0;
      pointer-events: none;
      z-index: 9999;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s;
      will-change: transform;
    }
    body.cursor-active .cursor-dot, body.cursor-active .cursor-ring { opacity: 1; }
    .cursor-dot {
      width: 6px; height: 6px;
      margin: -3px 0 0 -3px;
      background: #fff;
      box-shadow: 0 0 10px #fff, 0 0 20px var(--purple);
    }
    .cursor-ring {
      width: 34px; height: 34px;
      margin: -17px 0 0 -17px;
      border: 1.5px solid rgba(168, 85, 247, 0.8);
      transition: width 0.25s, height 0.25s, margin 0.25s, border-color 0.25s, opacity 0.3s;
    }
    .cursor-ring.hover {
      width: 60px; height: 60px;
      margin: -30px 0 0 -30px;
      border-color: var(--cyan);
    }
    .cursor-ring.down { width: 24px; height: 24px; margin: -12px 0 0 -12px; }
  }

  .loader {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    gap: 28px;
    z-index: 10000;
    transition: opacity 0.8s ease, visibility 0.8s;
  }
  .loader.hide { opacity: 0; visibility: hidden; }

  .loader-ring {
    width: 80px; height: 80px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-top-color: var(--purple);
    border-right-color: var(--cyan);
    animation: spin 1s linear infinite;
    position: relative;
    box-shadow: 0 0 30px rgba(168,85,247,0.5), inset 0 0 30px rgba(34,211,238,0.3);
  }
  .loader-ring::before {
    content: '';
    position: absolute;
    inset: 12px;
    border-radius: 50%;
    border: 3px solid transparent;
    border-bottom-color: var(--pink);
    animation: spin 0.7s linear infinite reverse;
  }
  .loader-text {
    font-family: 'Orbitron', sans-serif;
    letter-spacing: 8px;
    font-size: 14px;
    color: var(--purple);
    direction: ltr;
    animation: pulseText 1.5s ease-in-out infinite;
  }
  .loader-bar {
    width: 160px; height: 2px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
  }
  .loader-bar span {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--purple), var(--cyan));
    transition: width 0.3s ease;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulseText {
    0%, 100% { opacity: 0.4; text-shadow: 0 0 5px var(--purple); }
    50% { opacity: 1; text-shadow: 0 0 20px var(--purple), 0 0 40px var(--cyan); }
  }

  .container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: calc(30px + var(--safe-top)) 20px calc(30px + var(--safe-bottom));
    perspective: 1200px;
  }

  .card {
    --mx: 50%;
    --my: 50%;
    --rx: 0deg;
    --ry: 0deg;
    position: relative;
    width: 100%;
    max-width: 460px;
    padding: 40px 30px 30px;
    border-radius: 24px;
    background: rgba(10, 10, 20, 0.55);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow:
      0 30px 60px rgba(0, 0, 0, 0.5),
      inset 0 1px 0 rgba(255,255,255,0.1);
    text-align: center;
    transform: rotateX(var(--rx)) rotateY(var(--ry));
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    opacity: 0;
    translate: 0 30px;
  }
  .container.show .card {
    opacity: 1;
    translate: 0 0;
    transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 1s ease, translate 1s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .card.tilting { transition: transform 0.1s linear, opacity 1s ease, translate 1s ease; }

  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    padding: 1px;
    background: conic-gradient(from var(--angle),
      transparent 0%, var(--purple) 15%, var(--cyan) 25%, transparent 40%,
      transparent 60%, var(--pink) 75%, var(--purple) 85%, transparent 100%);
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    animation: rotateAngle 6s linear infinite;
    pointer-events: none;
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: radial-gradient(400px circle at var(--mx) var(--my), rgba(168,85,247,0.12), transparent 45%);
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card:hover::after { opacity: 1; }

  @keyframes rotateAngle { to { --angle: 360deg; } }

  /* ===== Avatar ===== */
  .avatar-wrap {
    position: relative;
    width: 120px; height: 120px;
    margin: 0 auto 20px;
  }
  .avatar-wrap::before {
    content: '';
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    background: conic-gradient(from var(--angle), var(--purple), var(--cyan), var(--pink), var(--purple));
    animation: rotateAngle 4s linear infinite;
    filter: blur(2px);
  }
  .avatar {
    position: relative;
    width: 100%; height: 100%;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    border: 3px solid var(--bg);
    text-shadow: 0 0 20px var(--purple);
    overflow: hidden;
  }
  /* ✅ الصورة */
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  .avatar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.15) 50%, transparent 60%);
    animation: shine 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes shine {
    0%, 100% { transform: translateX(-100%); }
    50% { transform: translateX(100%); }
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    border-radius: 50px;
    background: rgba(34, 211, 238, 0.1);
    border: 1px solid rgba(34, 211, 238, 0.3);
    font-size: 12px;
    color: var(--cyan);
    margin-bottom: 18px;
    font-weight: 500;
    direction: ltr;
  }
  .status .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--cyan);
    box-shadow: 0 0 10px var(--cyan);
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 2px;
    margin-bottom: 10px;
    direction: ltr;
    background: linear-gradient(90deg, var(--purple), var(--cyan), var(--pink), var(--purple));
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: gradientText 6s ease-in-out infinite alternate;
  }
  @keyframes gradientText { to { background-position: 100% 50%; } }

  .typing {
    font-family: 'Tajawal', 'Poppins', sans-serif;
    font-size: 15px;
    color: #d0d0e0;
    min-height: 24px;
    margin-bottom: 30px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
  .typing .caret {
    display: inline-block;
    width: 2px; height: 15px;
    background: var(--purple);
    margin-inline-start: 3px;
    vertical-align: middle;
    animation: blink 0.8s infinite;
  }

  .social-links {
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 22px;
    list-style: none;
  }

  .social-links a {
    --tx: 0px;
    --ty: 0px;
    --lift: 0px;
    --s: 1;
    position: relative;
    isolation: isolate;
    width: 68px; height: 68px;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 18px;
    color: #fff;
    font-size: 28px;
    text-decoration: none;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    transform: translate(var(--tx), calc(var(--ty) + var(--lift))) scale(var(--s));
    transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.35s, border-color 0.35s;
    outline: none;
  }
  .social-links a.magnet { transition: transform 0.12s linear, box-shadow 0.35s, border-color 0.35s; }

  .social-links a .fx {
    position: absolute;
    inset: 0;
    border-radius: inherit;
    overflow: hidden;
    z-index: -1;
  }
  .social-links a .fx::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 0.35s;
  }
  .social-links a i { transition: transform 0.35s; }

  .social-links a:hover,
  .social-links a:focus-visible {
    --lift: -8px;
    --s: 1.08;
    border-color: rgba(255,255,255,0.3);
  }
  .social-links a:hover i,
  .social-links a:focus-visible i { transform: scale(1.15) rotate(-5deg); }
  .social-links a:hover .fx::before,
  .social-links a:focus-visible .fx::before { opacity: 1; }
  .social-links a:focus-visible { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--cyan); }

  .social-links a::after {
    content: attr(data-label);
    position: absolute;
    bottom: calc(100% + 10px);
    left: 50%;
    translate: -50% 6px;
    padding: 4px 10px;
    border-radius: 8px;
    background: rgba(10,10,20,0.9);
    border: 1px solid rgba(255,255,255,0.12);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, translate 0.25s;
  }
  .social-links a:hover::after,
  .social-links a:focus-visible::after { opacity: 1; translate: -50% 0; }

  .tiktok .fx::before { background: linear-gradient(135deg, #25F4EE, #FE2C55, #000); }
  .tiktok:hover { box-shadow: 0 0 25px rgba(254, 44, 85, 0.7), 0 0 50px rgba(37, 244, 238, 0.4); }

  .instagram .fx::before { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
  .instagram:hover { box-shadow: 0 0 25px rgba(220, 39, 67, 0.7), 0 0 50px rgba(188, 24, 136, 0.4); }

  .telegram .fx::before { background: linear-gradient(135deg, #0088cc, #00c6ff); }
  .telegram:hover { box-shadow: 0 0 25px rgba(0, 136, 204, 0.7), 0 0 50px rgba(0, 198, 255, 0.4); }

  .ripple {
    position: absolute;
    width: 10px; height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    animation: ripple 0.6s ease-out forwards;
    pointer-events: none;
  }
  @keyframes ripple { to { transform: scale(16); opacity: 0; } }

  .actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 9px 16px;
    border-radius: 50px;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: #e6e6f0;
    font: 500 13px 'Tajawal', 'Poppins', sans-serif;
    transition: background 0.25s, border-color 0.25s, transform 0.2s;
  }
  .btn:hover { background: rgba(168,85,247,0.15); border-color: rgba(168,85,247,0.5); }
  .btn:active { transform: scale(0.96); }
  .btn:focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; }
  .btn[hidden] { display: none; }

  .footer {
    font-size: 11px;
    color: #8a8a9e;
    letter-spacing: 2px;
    text-transform: uppercase;
    direction: ltr;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .footer span { color: var(--purple); font-weight: 600; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(24px + var(--safe-bottom));
    translate: -50% 20px;
    padding: 10px 18px;
    border-radius: 12px;
    background: rgba(10,10,20,0.92);
    border: 1px solid rgba(34,211,238,0.4);
    color: #fff;
    font: 500 14px 'Tajawal', 'Poppins', sans-serif;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, translate 0.3s;
    z-index: 10001;
  }
  .toast.show { opacity: 1; translate: -50% 0; }

  @media (max-width: 500px) {
    .card { padding: 32px 22px 24px; border-radius: 20px; }
    h1 { font-size: 22px; }
    .avatar-wrap { width: 100px; height: 100px; }
    .avatar { font-size: 34px; }
    .social-links { gap: 14px; }
    .social-links a { width: 60px; height: 60px; font-size: 24px; border-radius: 16px; }
    .container { padding-left: 15px; padding-right: 15px; }
  }
  @media (max-width: 360px) {
    .social-links a { width: 54px; height: 54px; font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
    .video-bg video { display: none; }
  }
</style>
</head>
<body>

  <div class="video-bg" aria-hidden="true">
    <video id="bgVideo" autoplay muted loop playsinline preload="auto">
      <source src="https://res.cloudinary.com/t6zzg4qd/video/upload/v1791989666/bg.mp4" type="video/mp4">
    </video>
  </div>

  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="cursor-dot" aria-hidden="true"></div>
  <div class="cursor-ring" aria-hidden="true"></div>

  <div class="loader" id="loader" role="status" aria-label="Loading">
    <div class="loader-ring"></div>
    <div class="loader-text">LOADING</div>
    <div class="loader-bar"><span id="loaderBar"></span></div>
  </div>

  <main class="container" id="main">
    <div class="card" id="card">

      <!-- ✅ الصورة ديالك -->
      <div class="avatar-wrap">
        <div class="avatar">
          <img src="avatar.jpg" alt="1uci17er">
        </div>
      </div>

      <div class="status">
        <span class="dot"></span>
        Online Now
      </div>

      <h1>1UCI17ER</h1>

      <p class="typing" aria-live="polite">
        <span id="typingText"></span><span class="caret" aria-hidden="true"></span>
      </p>

      <ul class="social-links">
        <li>
          <a href="https://www.tiktok.com/@1uci17er" target="_blank" rel="noopener noreferrer"
             class="tiktok" data-label="TikTok" aria-label="TikTok">
            <span class="fx"></span><i class="fab fa-tiktok" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://www.instagram.com/1uci17er" target="_blank" rel="noopener noreferrer"
             class="instagram" data-label="Instagram" aria-label="Instagram">
            <span class="fx"></span><i class="fab fa-instagram" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a href="https://t.me/l1uci7er" target="_blank" rel="noopener noreferrer"
             class="telegram" data-label="Telegram" aria-label="Telegram">
            <span class="fx"></span><i class="fab fa-telegram" aria-hidden="true"></i>
          </a>
        </li>
      </ul>

      <div class="actions">
        <button class="btn" id="shareBtn" type="button">
          <i class="fa-solid fa-share-nodes" aria-hidden="true"></i><span>شارك الصفحة</span>
        </button>
        <button class="btn" id="soundBtn" type="button" aria-pressed="false" hidden>
          <i class="fa-solid fa-volume-xmark" aria-hidden="true"></i><span>الصوت</span>
        </button>
      </div>

      <footer class="footer">© <span id="year">2026</span> — Made by <span>1uci17er</span></footer>

    </div>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const finePointer  = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const $ = (s) => document.querySelector(s);

  $('#year').textContent = new Date().getFullYear();

  const toastEl = $('#toast');
  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }

  const loader = $('#loader');
  const bar = $('#loaderBar');
  let progress = 0;
  let revealed = false;
  const progTimer = setInterval(() => {
    progress = Math.min(progress + Math.random() * 18, 90);
    bar.style.width = progress + '%';
  }, 150);

  function reveal() {
    if (revealed) return;
    revealed = true;
    clearInterval(progTimer);
    bar.style.width = '100%';
    setTimeout(() => {
      loader.classList.add('hide');
      $('#main').classList.add('show');
      startTyping();
    }, 300);
  }
  const startTime = performance.now();
  window.addEventListener('load', () => {
    const wait = Math.max(0, 900 - (performance.now() - startTime));
    setTimeout(reveal, wait);
  });
  setTimeout(reveal, 3500);

  /* ===== Background video (مع محاولة الصوت التلقائي) ===== */
  const video = $('#bgVideo');
  const soundBtn = $('#soundBtn');
  if (video && !reduceMotion) {
    video.addEventListener('playing', () => {
      video.classList.add('ready');
      soundBtn.hidden = false;
    }, { once: true });
    video.addEventListener('error', () => video.remove(), true);

    // نحاولو نشغلو بالصوت أولاً
    video.muted = false;
    video.volume = 0.5;

    const attempt = video.play();
    if (attempt && attempt.catch) {
      attempt
        .then(() => {
          // نجح بالصوت ✅
          soundBtn.setAttribute('aria-pressed', 'true');
          soundBtn.querySelector('i').className = 'fa-solid fa-volume-high';
        })
        .catch(() => {
          // المتصفح رفض الصوت — نشغلو muted
          video.muted = true;
          video.play().then(() => {
            soundBtn.setAttribute('aria-pressed', 'false');
            soundBtn.querySelector('i').className = 'fa-solid fa-volume-xmark';
            // نعرضو رسالة للمستخدم
            setTimeout(() => {
              toast('🔊 كليكي باش تسمع الصوت');
            }, 1600);
            // أول كليك كيرجع الصوت
            const enableSound = () => {
              video.muted = false;
              video.volume = 0.5;
              soundBtn.setAttribute('aria-pressed', 'true');
              soundBtn.querySelector('i').className = 'fa-solid fa-volume-high';
              document.removeEventListener('click', enableSound);
              document.removeEventListener('touchstart', enableSound);
            };
            document.addEventListener('click', enableSound, { once: true });
            document.addEventListener('touchstart', enableSound, { once: true });
          }).catch(() => {});
        });
    }

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (!video.muted) video.volume = 0.5;
      const on = !video.muted;
      soundBtn.setAttribute('aria-pressed', String(on));
      soundBtn.querySelector('i').className = 'fa-solid ' + (on ? 'fa-volume-high' : 'fa-volume-xmark');
    });
  } else if (video) {
    video.remove();
  }

  const typingEl = $('#typingText');
  const texts = [
    'تابعني على مواقع التواصل 👇',
    'اشترك في القناة و لا تنسى الإشعارات 🔔',
    'شكراً على الزيارة ❤️'
  ];
  const split = (s) => (window.Intl && Intl.Segmenter)
    ? Array.from(new Intl.Segmenter('ar', { granularity: 'grapheme' }).segment(s), (x) => x.segment)
    : Array.from(s);
  const chars = texts.map(split);
  let textIndex = 0, charIndex = 0, deleting = false;

  function startTyping() {
    if (reduceMotion) {
      typingEl.textContent = texts[textIndex];
      setTimeout(() => {
        textIndex = (textIndex + 1) % texts.length;
        startTyping();
      }, 4000);
      return;
    }
    tick();
  }

  function tick() {
    const current = chars[textIndex];
    charIndex += deleting ? -1 : 1;
    typingEl.textContent = current.slice(0, charIndex).join('');

    if (!deleting && charIndex === current.length) {
      deleting = true;
      return setTimeout(tick, 1800);
    }
    if (deleting && charIndex === 0) {
      deleting = false;
      textIndex = (textIndex + 1) % texts.length;
      return setTimeout(tick, 400);
    }
    setTimeout(tick, deleting ? 35 : 70);
  }

  if (finePointer && !reduceMotion) {
    document.body.classList.add('custom-cursor');
    const dot = $('.cursor-dot');
    const ring = $('.cursor-ring');
    let mx = innerWidth / 2, my = innerHeight / 2, rx = mx, ry = my;

    window.addEventListener('pointermove', (e) => {
      if (e.pointerType !== 'mouse') return;
      mx = e.clientX; my = e.clientY;
      dot.style.transform = `translate3d(${mx}px, ${my}px, 0)`;
      document.body.classList.add('cursor-active');
    });
    document.addEventListener('mouseleave', () => document.body.classList.remove('cursor-active'));
    window.addEventListener('pointerdown', () => ring.classList.add('down'));
    window.addEventListener('pointerup', () => ring.classList.remove('down'));

    (function animateRing() {
      rx += (mx - rx) * 0.15;
      ry += (my - ry) * 0.15;
      ring.style.transform = `translate3d(${rx}px, ${ry}px, 0)`;
      requestAnimationFrame(animateRing);
    })();

    document.addEventListener('pointerover', (e) => {
      if (e.target.closest('a, button')) ring.classList.add('hover');
    });
    document.addEventListener('pointerout', (e) => {
      if (e.target.closest('a, button') && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('a, button'))) {
        ring.classList.remove('hover');
      }
    });
  }

  const card = $('#card');
  if (finePointer && !reduceMotion) {
    card.addEventListener('pointermove', (e) => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.classList.add('tilting');
      card.style.setProperty('--rx', ((0.5 - y) * 10).toFixed(2) + 'deg');
      card.style.setProperty('--ry', ((x - 0.5) * 10).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
      card.style.setProperty('--my', (y * 100).toFixed(1) + '%');
    });
    card.addEventListener('pointerleave', () => {
      card.classList.remove('tilting');
      card.style.setProperty('--rx', '0deg');
      card.style.setProperty('--ry', '0deg');
    });
  }

  document.querySelectorAll('.social-links a').forEach((a) => {
    if (finePointer && !reduceMotion) {
      a.addEventListener('pointermove', (e) => {
        const r = a.getBoundingClientRect();
        a.classList.add('magnet');
        a.style.setProperty('--tx', ((e.clientX - r.left - r.width / 2) * 0.3).toFixed(1) + 'px');
        a.style.setProperty('--ty', ((e.clientY - r.top - r.height / 2) * 0.3).toFixed(1) + 'px');
      });
      a.addEventListener('pointerleave', () => {
        a.classList.remove('magnet');
        a.style.setProperty('--tx', '0px');
        a.style.setProperty('--ty', '0px');
      });
    }
    a.addEventListener('pointerdown', (e) => {
      if (reduceMotion) return;
      const r = a.getBoundingClientRect();
      const ripple = document.createElement('span');
      ripple.className = 'ripple';
      ripple.style.left = (e.clientX - r.left) + 'px';
      ripple.style.top = (e.clientY - r.top) + 'px';
      a.querySelector('.fx').appendChild(ripple);
      ripple.addEventListener('animationend', () => ripple.remove());
    });
  });

  $('#shareBtn').addEventListener('click', async () => {
    const data = { title: '1uci17er', text: 'تابع 1uci17er على مواقع التواصل', url: location.href };
    try {
      if (navigator.share) {
        await navigator.share(data);
      } else if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(location.href);
        toast('تم نسخ الرابط ✅');
      } else {
        const ta = document.createElement('textarea');
        ta.value = location.href;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        toast('تم نسخ الرابط ✅');
      }
    } catch (err) {
      if (err && err.name !== 'AbortError') toast('ما قدرناش ننسخو الرابط');
    }
  });

  const canvas = $('#particles');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, particles = [], rafId = null;
  const pointer = { x: -9999, y: -9999 };
  const COLORS = ['168,85,247', '34,211,238', '244,114,182'];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.min(70, Math.floor((W * H) / 18000));
    particles = Array.from({ length: count }, () => ({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.6 + 0.6,
      c: COLORS[(Math.random() * COLORS.length) | 0]
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    const LINK = 110;
    for (let i = 0; i < particles.length; i++) {
      const p = particles[i];
      const dx = p.x - pointer.x, dy = p.y - pointer.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 14400) {
        const f = (14400 - d2) / 14400 * 0.6;
        const d = Math.sqrt(d2) || 1;
        p.x += (dx / d) * f; p.y += (dy / d) * f;
      }
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${p.c},0.8)`;
      ctx.fill();

      for (let j = i + 1; j < particles.length; j++) {
        const q = particles[j];
        const lx = p.x - q.x, ly = p.y - q.y;
        const dist = Math.sqrt(lx * lx + ly * ly);
        if (dist < LINK) {
          ctx.strokeStyle = `rgba(${p.c},${(1 - dist / LINK) * 0.18})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(q.x, q.y);
          ctx.stroke();
        }
      }
    }
    rafId = requestAnimationFrame(draw);
  }

  if (!reduceMotion) {
    resize();
    draw();
    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(resize, 150);
    });
    window.addEventListener('pointermove', (e) => { pointer.x = e.clientX; pointer.y = e.clientY; });
    window.addEventListener('pointerleave', () => { pointer.x = pointer.y = -9999; });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (video && video.isConnected) video.pause();
    } else {
      if (!reduceMotion && !rafId) draw();
      if (video && video.isConnected) {
        const p = video.play();
        if (p && p.catch) p.catch(() => {});
      }
    }
  });
})();
</script>

<noscript>
  <style>.loader{display:none}.card{opacity:1;translate:0 0}</style>
</noscript>
